<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'">
<title>Explain</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #12161f; color: #cfd6e4; font: 13px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-bottom: 1px solid #262c38; }
  #title { flex: 1; min-width: 0; color: #7fd0a0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { background: #1b2130; color: #cfd6e4; border: 1px solid #33405a; border-radius: 4px; padding: 2px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: #7fd0a0; }
  #body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px 14px; }
  p { margin: 0 0 6px; } ul { margin: 0 0 6px; padding-left: 20px; } li { margin: 2px 0; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
</style>
</head>
<body>
<header><span id="title"></span><button id="close" title="close (Esc) — the next header you rest on opens it again">Close</button></header>
<div id="body"></div>
</body>
</html>
